name: Source and host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libsqlite3-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Check repository
        run: python tools/check_repository.py --history
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build-test -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build
        run: cmake --build build-test -j2
      - name: Test
        run: ctest --test-dir build-test --output-on-failure -j2
